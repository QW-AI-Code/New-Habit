name: New Habit Android Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty to use the app versionName)'
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: new-habit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish New Habit APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -eu
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$version" ] || version="1.0.0"
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          version="${tag#v}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then publish=false; else publish=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version publish=$publish"

      - name: Validate resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for xml in Path('app/src/main/res').rglob('*.xml'): ET.parse(xml)
          PY

      - name: Prepare signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          path="$RUNNER_TEMP/release.jks"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No keystore secrets found, release APKs will be signed with the debug key."
            echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$path"
          keytool -list -keystore "$path" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        env:
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.enabled == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Collect the three release APKs
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          out=app/build/outputs/apk/release
          echo "Gradle produced:"; find "$out" -name '*.apk' -print
          mkdir -p release-files
          universal=$(find "$out" -name '*universal*.apk' | head -n 1)
          [ -n "$universal" ] || universal=$(find "$out" -name 'app-release.apk' | head -n 1)
          [ -n "$universal" ] || universal=$(find "$out" -name '*.apk' | head -n 1)
          if [ -z "$universal" ]; then echo "::error::No APK was produced"; exit 1; fi
          cp "$universal" "release-files/new-habit-v${APP_VERSION}-universal.apk"
          for abi in arm64-v8a armeabi-v7a; do
            src=$(find "$out" -name "*-$abi-*.apk" | head -n 1)
            [ -n "$src" ] || src="$universal"
            cp "$src" "release-files/new-habit-v${APP_VERSION}-$abi.apk"
          done
          echo "Will publish:"; ls -lh release-files

      - uses: actions/upload-artifact@v4
        with:
          name: new-habit-${{ steps.meta.outputs.tag }}-apks
          path: release-files/*.apk

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "New Habit $TAG" --notes-file .github/release-notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" release-files/*.apk --repo "$GITHUB_REPOSITORY" --title "New Habit $TAG" --notes-file .github/release-notes.md --target "$GITHUB_SHA" --latest
          fi
          echo "Assets now published:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          echo "Release URL: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
